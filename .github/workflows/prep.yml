name: apply-payload

on:
  push:
    paths:
      - "*payload.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply payload
        run: |
          PAYLOAD=$(ls -t *payload.zip 2>/dev/null | head -1)
          if [ -n "$PAYLOAD" ]; then
            mkdir -p /tmp/payload
            unzip -o "$PAYLOAD" -d /tmp/payload
            bash /tmp/payload/apply.sh
            rm -f "$PAYLOAD"
          fi
      - name: commit and push
        run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add -A
          git commit -m "chore: apply staged web improvements" || echo "nothing to commit"
          git push
